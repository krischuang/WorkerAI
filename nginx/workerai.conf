# /etc/nginx/conf.d/workerai.conf
# WorkerAI — workerai.ddns.net
#
# This file is written by provision-https.sh.
# Phase 1 (pre-TLS): comment block below is active.
# Phase 2 (post-TLS): replace with the HTTPS server block below.

# ── WebSocket upgrade map ────────────────────────────────────────────────────
# Must live in the http context.  Placed here (included from nginx.conf's
# http block) so the workerai server blocks can reference $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name workerai.ddns.net;

    # Let's Encrypt ACME challenge (also needed at renewal time)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workerai.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/workerai.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workerai.ddns.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # ── WebSocket SSH terminal (/ws → ws-server port 3099) ───────────────────
    # The standalone ws-server.ts listens on 3099.  All WebSocket upgrades
    # from InteractiveTerminal.tsx are sent here when on HTTPS.
    location /ws {
        proxy_pass         http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSH sessions can be long; keep the tunnel open for up to 1 hour idle.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Next.js app (port 3000) ───────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
