name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  APP_DIR: claude-task-monitor
  VERIFIER_DIR: verifier-service

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-task-monitor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: claude-task-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ── Job 2: Unit tests with coverage ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests (coverage ≥70%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-task-monitor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: claude-task-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"

      - name: Run unit tests with coverage
        run: npm run test:coverage
        # vitest.config.ts already enforces thresholds (lines:85, functions:90,
        # branches:80, statements:85), all exceed the 70% minimum.
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: claude-task-monitor/coverage/
          retention-days: 14

  # ── Job 3: Production build ──────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-task-monitor
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: claude-task-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"

      - name: Build Next.js (production)
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"
          # Required for auth middleware; any non-empty value works for build.
          AUTH_SECRET: "ci-build-secret"

  # ── Job 4: E2E tests ─────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-task-monitor

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claude_task_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/claude_task_monitor?schema=public"
      AUTH_SECRET: "ci-e2e-secret"
      # Required by middleware.ts and lib/require-admin.ts to gate /admin and
      # /api/admin routes. Without it, those routes return 503 regardless of
      # any cookie presented, which is what previously failed e2e/admin.spec.ts.
      # Test-only value, never used outside this CI job.
      ADMIN_PASSWORD: "ci-e2e-admin-password"
      # The global API rate limiter (lib/api-rate-limit.ts) is enabled by
      # default and reliably produces cascading 429s partway through this
      # sequential test suite otherwise, confirmed by direct reproduction.
      # This env var is the only mechanism that actually reaches
      # middleware.ts's Edge Runtime check; a SystemConfig/admin-API toggle
      # cannot (see isRateLimitEnabled's doc comment for why).
      RATE_LIMIT_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: claude-task-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: claude-task-monitor/test-results/
          retention-days: 7

  # ── Job 5: Python verifier service ───────────────────────────────────────────
  # Standalone FastAPI microservice (see verifier-service/README.md), fully
  # independent of the Next.js app's dependency tree and test run, so it gets
  # its own job rather than being folded into an existing one.
  verifier-service:
    name: Verifier Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: verifier-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v
