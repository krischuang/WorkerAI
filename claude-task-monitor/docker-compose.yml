services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: claude_task_monitor
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_task_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override DATABASE_URL so the app connects to the 'db' service, not localhost.
      DATABASE_URL: postgresql://postgres:postgres_dev@db:5432/claude_task_monitor?schema=public
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      # If SSH keys live outside any home directory, list their parent dirs here.
      # Usually not needed when keys are under /home/<user>/.ssh.
      SSH_KEY_ALLOWED_PATHS: ${SSH_KEY_ALLOWED_PATHS:-}
    volumes:
      # Mount the host SSH key directory at the same path inside the container so
      # stored sshKeyPath values (e.g. /home/ec2-user/.ssh/WorkerAI.pem) resolve
      # correctly.  Override SSH_KEY_DIR in your shell or .env if needed.
      - ${SSH_KEY_DIR:-/home/ec2-user/.ssh}:/home/ec2-user/.ssh:ro
    ports:
      - "3000:3000"
      - "3099:3099"
    entrypoint: ["sh", "/app/scripts/docker-entrypoint.sh"]
    command: ["sh", "-c", "npm start & npm run ws & wait"]

volumes:
  db_data:
