services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: claude_task_monitor
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_task_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override DATABASE_URL so the app connects to the 'db' service, not localhost.
      DATABASE_URL: postgresql://postgres:postgres_dev@db:5432/claude_task_monitor?schema=public
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      # The container runs as root (home = /root).  SSH keys mounted at /root/.ssh
      # are automatically accepted by validateSshKeyPath.  If your keys live
      # elsewhere, also set SSH_KEY_ALLOWED_PATHS in your .env.
      SSH_KEY_ALLOWED_PATHS: ${SSH_KEY_ALLOWED_PATHS:-/root/.ssh}
    volumes:
      # Mount the host SSH key directory so the app can reach remote workers.
      # Override SSH_KEY_DIR in your shell or .env to point at a different path.
      - ${SSH_KEY_DIR:-/root/.ssh}:/root/.ssh:ro
    ports:
      - "3000:3000"
      - "3099:3099"
    entrypoint: ["sh", "/app/scripts/docker-entrypoint.sh"]
    command: ["sh", "-c", "npm start & npm run ws & wait"]

volumes:
  db_data:
